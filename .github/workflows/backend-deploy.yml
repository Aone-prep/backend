on:
  workflow_dispatch:
    inputs:
      DOCKER_TAG:
        description: 'Docker image tag'
        required: true
  repository_dispatch:
    types: [deploy-backend] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Create SSH keys from secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Create Azure Credentials
        run: |
          mkdir -p $HOME/.azure
          echo '[default]' > $HOME/.azure/credentials
          echo 'azure_subscription_id = bac12785-937a-4bd3-93d0-99f6eb81ba22' >> $HOME/.azure/credentials
          echo 'azure_tenant_id = ed27b597-cea0-4942-8c6f-40e6a78bf47d' >> $HOME/.azure/credentials
          echo 'azure_username = ${{ secrets.AZURE_USER_NAME }}' >> $HOME/.azure/credentials
          echo 'azure_password = ${{ secrets.AZURE_PASSWORD }}' >> $HOME/.azure/credentials

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure Login
        run: |
          az login --use-device-code || az login -u "${{ secrets.AZURE_USER_NAME }}" -p "${{ secrets.AZURE_PASSWORD }}"
          az account set --subscription "bac12785-937a-4bd3-93d0-99f6eb81ba22"

      - name: Get Azure VM IP
        id: get-ip
        run: |
          VM_IP=$(az network nic ip-config show --nic-name backend-nic --name backend-ip --resource-group myResourceGroup --query "privateIPAddress" -o tsv)
          echo "VM_IP=$VM_IP" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy
        run: echo "Deploying application..."

      - name: Run Azure Commands
        run: |
          az account show
          az group list

      - name: Deploy to Azure VM
        env:
            DOCKER_TAG: ${{ github.event.inputs.DOCKER_TAG }}
            VM_IP: ${{ env.VM_IP }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
            # Create deployment script
            cat > deploy.sh << EOL
            #!/bin/bash
            
            # Docker login using credentials
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull and run the Docker image
            docker pull stalinrijal/aone-prep:${DOCKER_TAG}
            docker stop \$(docker ps -q) 2>/dev/null || true
            docker rm \$(docker ps -a -q) 2>/dev/null || true
            docker run -d -p 3030:3030 stalinrijal/aone-prep:${DOCKER_TAG}
            EOL
            
            # Copy deployment script to VM and execute
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy.sh adminuser@$VM_IP:~/deploy.sh
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa adminuser@$VM_IP "export DOCKER_TAG=${DOCKER_TAG} && export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' && export DOCKER_PASSWORD='${{ secrets.DOCKER_PASSWORD }}' && chmod +x ~/deploy.sh && sudo -E bash ~/deploy.sh"
