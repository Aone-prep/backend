name: Backend build

on:
  push:
    branches:
      - pipeline

env:
  DOCKER_IMAGE: stalinrijal/aone-prep-backend
  DOCKER_TAG: backend-${{ github.run_number }}

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub login
        run: docker info

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: false  # Don't push yet, we'll scan first
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          load: true   # Load the image locally for scanning

      - name: Scan local image for vulnerabilities
        continue-on-error: true  # Continue even if vulnerabilities are found
        run: |
          # Install Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.18.3
          # Scan the local image
          trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Push Docker image
        if: success() || failure()  # Push even if scan finds vulnerabilities
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Scan Docker Hub image
        continue-on-error: true
        run: |
          # Scan the pushed image
          trivy image --exit-code 0 --security-checks vuln ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Output image digest
        run: 'echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"'

      - name: Prune old images (keep only 5 latest)
        run: |
          echo "Pruning images to keep only the 5 latest..."
          docker image prune -f --filter "until=240h"
          docker images --filter "dangling=false" --format "{{.Repository}}:{{.Tag}}" | head -n -5 | xargs docker rmi -f || true

      - name: Create SSH keys from secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Create Azure Credentials
        run: |
          mkdir -p $HOME/.azure
          echo '[default]' > $HOME/.azure/credentials
          echo 'azure_subscription_id = bac12785-937a-4bd3-93d0-99f6eb81ba22' >> $HOME/.azure/credentials
          echo 'azure_tenant_id = ed27b597-cea0-4942-8c6f-40e6a78bf47d' >> $HOME/.azure/credentials
          echo 'azure_username = ${{ secrets.AZURE_USER_NAME }}' >> $HOME/.azure/credentials
          echo 'azure_password = ${{ secrets.AZURE_PASSWORD }}' >> $HOME/.azure/credentials

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure Login
        run: |
          az login --use-device-code || az login -u "${{ secrets.AZURE_USER_NAME }}" -p "${{ secrets.AZURE_PASSWORD }}"
          az account set --subscription "bac12785-937a-4bd3-93d0-99f6eb81ba22"

      - name: Get Azure VM IP
        id: get-ip
        run: |
          VM_IP=$(az network public-ip show --name backend-public-ip --resource-group myResourceGroup --query "ipAddress" -o tsv)
          echo "VM_IP=$VM_IP" >> $GITHUB_ENV

      - name: Run Azure Commands
        run: |
          az account show
          az group list

      - name: Deploy to Azure VM
        env:
          DOCKER_TAG: backend-${{ github.run_number }}
          VM_IP: ${{ env.VM_IP }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Create deployment script with proper error handling and logging
          cat > deploy.sh << 'EOL'
          #!/bin/bash
          
          # Exit on any error
          set -e
          
          # Enable command printing
          set -x
          
          # Get arguments
          DOCKER_TAG="$1"
          DOCKER_USERNAME="$2"
          DOCKER_PASSWORD="$3"
          
          # Function to log messages
          log_message() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"
          }
          
          # Docker login using credentials
          log_message "Logging into Docker Hub..."
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          
          # Pull the Docker image
          log_message "Pulling image: stalinrijal/aone-prep-backend:$DOCKER_TAG"
          docker pull stalinrijal/aone-prep-backend:$DOCKER_TAG
          
          # Stop and remove existing containers
          log_message "Cleaning up existing containers..."
          docker ps -q | xargs -r docker stop
          docker ps -a -q | xargs -r docker rm
          
          # Run the new container
          log_message "Starting new container..."
          docker run -d -p 3030:3030 stalinrijal/aone-prep-backend:$DOCKER_TAG
          
          # Verify container is running
          log_message "Verifying container status..."
          docker ps
          
          log_message "Deployment completed successfully!"
          EOL
          
          # Make script executable
          chmod +x deploy.sh
          
          # Copy deployment script to VM
          echo "Copying deployment script to VM..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy.sh adminuser@$VM_IP:~/deploy.sh
          
          # Execute deployment script on VM
          echo "Executing deployment script on VM..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa adminuser@$VM_IP "chmod +x ~/deploy.sh && sudo -E ~/deploy.sh '$DOCKER_TAG' '${{ secrets.DOCKER_USERNAME }}' '${{ secrets.DOCKER_PASSWORD }}'"

      - name: Verify Deployment
        run: |
          echo "Deployment completed. Verifying..."
          echo "Docker Tag used: ${{ env.DOCKER_TAG }}"
          echo "VM IP: ${{ env.VM_IP }}"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up sensitive files..."
          rm -f ~/.ssh/id_rsa*
          rm -f $HOME/.azure/credentials
          docker logout