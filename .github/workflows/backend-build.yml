name: Backend build

on:
  push:
    branches:
      - pipeline

env:
  DOCKER_IMAGE: stalinrijal/aone-prep-backend
  DOCKER_TAG: backend-${{ github.run_number }}

# Add permissions block at the workflow level
permissions:
  contents: read
  actions: write    # This is required to trigger other workflows
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
